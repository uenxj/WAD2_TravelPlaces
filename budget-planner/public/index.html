<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div id="app" class="container py-3 pb-5" v-cloak>

  <header class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Budget Planner</h1>
    <span class="text-muted small" data-testid="trip-id">Trip: {{ tripId }}</span>
  </header>

  <div v-if="toast" class="alert alert-danger py-2" role="alert" data-testid="error">{{ toast }}</div>

  <div v-if="loading" class="text-muted">Loading…</div>

  <!-- ============ SETUP ============ -->
  <section v-else-if="!summary || editingBudget" class="card card-body" data-testid="setup">
    <h2 class="h5">{{ summary ? 'Edit budget' : 'Set your trip budget' }}</h2>
    <form @submit.prevent="saveBudget">
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-4">
          <label class="form-label">Total budget</label>
          <input type="number" min="1" step="0.01" class="form-control" v-model.number="form.total" required data-testid="total-input">
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label">Home currency</label>
          <input class="form-control text-uppercase" maxlength="3" v-model="form.homeCurrency" required data-testid="home-input">
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label">Destination currency</label>
          <input class="form-control text-uppercase" maxlength="3" v-model="form.destCurrency" required data-testid="dest-input">
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <label class="form-label mb-0">Split across categories ({{ form.homeCurrency || '…' }})</label>
        <button type="button" class="btn btn-sm btn-outline-secondary" @click="splitEvenly">Split evenly</button>
      </div>
      <div class="row g-2 mb-2" v-for="(c, i) in form.categories" :key="i">
        <div class="col-7"><input class="form-control" v-model="c.name" placeholder="Category" required></div>
        <div class="col-4"><input type="number" min="0" step="0.01" class="form-control" v-model.number="c.allocated" required :data-testid="'alloc-' + i"></div>
        <div class="col-1 d-grid"><button type="button" class="btn btn-outline-danger" @click="form.categories.splice(i, 1)" aria-label="Remove category">×</button></div>
      </div>
      <button type="button" class="btn btn-sm btn-link px-0 mb-3" @click="form.categories.push({ name: '', allocated: 0 })">+ Add category</button>

      <div class="small mb-3" :class="allocatedSum > form.total ? 'text-danger' : 'text-muted'">
        Allocated {{ fmt(allocatedSum) }} of {{ fmt(form.total || 0) }}
      </div>

      <button class="btn btn-primary" data-testid="save-budget">Save budget</button>
      <button type="button" class="btn btn-link" v-if="summary" @click="editingBudget = false">Cancel</button>
    </form>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <template v-else>

    <!-- conflicts -->
    <div v-if="summary.conflicts.length" class="mb-3" data-testid="conflicts">
      <div v-for="(c, i) in summary.conflicts" :key="i" class="alert py-2 mb-2"
           :class="{ 'alert-danger': c.severity === 'high', 'alert-warning': c.severity !== 'high' }">
        <strong>{{ c.message }}</strong>
        <div class="small">{{ c.suggestion }}</div>
      </div>
    </div>

    <!-- summary cards -->
    <div class="row g-2 mb-3">
      <div class="col-4"><div class="card card-body stat"><div class="label">Budget</div><div class="value" data-testid="total">{{ fmt(summary.total) }}</div></div></div>
      <div class="col-4"><div class="card card-body stat"><div class="label">Spent</div><div class="value" data-testid="spent">{{ fmt(summary.spentTotal) }}</div></div></div>
      <div class="col-4"><div class="card card-body stat" :class="{ 'stat-over': summary.remaining < 0 }"><div class="label">Remaining</div><div class="value" data-testid="remaining">{{ fmt(summary.remaining) }}</div></div></div>
    </div>

    <div class="progress mb-1" style="height: 14px;" role="progressbar" :aria-valuenow="summary.percentUsed" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar" :class="barClass(summary.status)" :style="{ width: Math.min(summary.percentUsed, 100) + '%' }"></div>
    </div>
    <div class="d-flex justify-content-between small text-muted mb-3">
      <span>{{ summary.percentUsed }}% used</span>
      <span v-if="summary.upcomingTotal > 0">Projected: {{ fmt(summary.projectedTotal) }}</span>
    </div>

    <!-- add expense -->
    <section class="card card-body mb-3">
      <h2 class="h6">Log an expense</h2>
      <form @submit.prevent="addExpense" class="row g-2">
        <div class="col-6 col-md-3">
          <input type="number" min="0.01" step="0.01" class="form-control" placeholder="Amount" v-model.number="expense.amount" required data-testid="expense-amount">
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" v-model="expense.currency" data-testid="expense-currency">
            <option :value="summary.destCurrency">{{ summary.destCurrency }}</option>
            <option v-if="summary.homeCurrency !== summary.destCurrency" :value="summary.homeCurrency">{{ summary.homeCurrency }}</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <select class="form-select" v-model="expense.category" required data-testid="expense-category">
            <option v-for="c in summary.categories" :key="c.name" :value="c.name">{{ c.name }}</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <input class="form-control" placeholder="Note (optional)" v-model="expense.note" maxlength="200">
        </div>
        <div class="col-12 small text-muted" v-if="preview" data-testid="conversion-preview">
          ≈ {{ fmt(preview.home) }} <span v-if="preview.stale">(rate may be out of date)</span>
          <span class="ms-1">· 1 {{ expense.currency }} = {{ preview.rate.toFixed(4) }} {{ summary.homeCurrency }}</span>
        </div>
        <div class="col-12 d-grid d-md-block">
          <button class="btn btn-primary" :disabled="busy" data-testid="add-expense">+ Add expense</button>
        </div>
      </form>
    </section>

    <!-- categories -->
    <section class="mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="h6 mb-2">Categories</h2>
        <button class="btn btn-sm btn-outline-secondary" @click="startEdit" data-testid="edit-budget">Edit budget</button>
      </div>
      <div class="card card-body mb-2 py-2" v-for="c in summary.categories" :key="c.name" :data-testid="'cat-' + c.name">
        <div class="d-flex justify-content-between">
          <strong>{{ c.name }}</strong>
          <span class="small" :class="{ 'text-danger': c.status === 'over' }">{{ fmt(c.spent) }} / {{ fmt(c.allocated) }}</span>
        </div>
        <div class="progress my-1" style="height: 8px;">
          <div class="progress-bar" :class="barClass(c.status)" :style="{ width: Math.min(c.percentUsed, 100) + '%' }"></div>
        </div>
        <div class="small text-muted">{{ c.percentUsed }}% used · {{ fmt(c.remaining) }} left</div>
      </div>
    </section>

    <!-- expense list -->
    <section>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Expenses</h2>
        <select class="form-select form-select-sm w-auto" v-model="filter">
          <option value="">All categories</option>
          <option v-for="c in summary.categories" :key="c.name" :value="c.name">{{ c.name }}</option>
        </select>
      </div>
      <div v-if="!shownExpenses.length" class="text-muted small" data-testid="empty">No expenses yet.</div>
      <ul class="list-group" data-testid="expense-list">
        <li class="list-group-item d-flex justify-content-between align-items-start" v-for="e in shownExpenses" :key="e.id">
          <div>
            <div><strong>{{ e.category }}</strong> <span class="text-muted small">{{ e.date }}</span></div>
            <div class="small text-muted" v-if="e.note">{{ e.note }}</div>
            <div class="small text-muted" v-if="e.currency !== summary.homeCurrency">
              {{ e.amount.toFixed(2) }} {{ e.currency }} @ {{ e.rateUsed.toFixed(4) }}
            </div>
          </div>
          <div class="text-end">
            <div>{{ fmt(e.amountHome) }}</div>
            <button class="btn btn-sm btn-link text-danger p-0" @click="removeExpense(e)" :data-testid="'delete-' + e.id">Delete</button>
          </div>
        </li>
      </ul>
    </section>
  </template>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="app.js"></script>
</body>
</html>
